# Compile-and-test verification for the reusable Swift packages.
#
# This job intentionally does NOT touch the macOS app target: that build needs
# XcodeGen to generate Strand.xcodeproj and a wired-up test scheme, and the app
# release is produced and anonymized by hand. The packages, by contrast, build
# and test on their own with plain SwiftPM — no Xcode project, no signing, no
# secrets — which makes them a safe, self-contained CI check that leaks nothing.
name: Swift Packages CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'Packages/**'
      - 'Tools/SleepBench/**'
      - 'Tools/SleepPSG/**'
      - 'Tools/Backfill/**'
      - 'Tools/HRVArtifactBench/**'
      - '.github/workflows/swift-packages.yml'
  push:
    branches: [main]
    paths:
      - 'Packages/**'
      - 'Tools/SleepBench/**'
      - 'Tools/SleepPSG/**'
      - 'Tools/Backfill/**'
      - 'Tools/HRVArtifactBench/**'
      - '.github/workflows/swift-packages.yml'
  workflow_dispatch:

concurrency:
  group: swift-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        package:
          - WhoopProtocol
          - OuraProtocol
          - PolarProtocol
          - WhoopStore
          - StrandAnalytics
          - StrandImport
          - StrandDesign
          - NoopLocalAccess
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build ${{ matrix.package }}
        run: swift build
        working-directory: Packages/${{ matrix.package }}

      - name: Test ${{ matrix.package }}
        run: swift test
        working-directory: Packages/${{ matrix.package }}

  # Tool packages are part of the evidence used to accept/reject analytics changes, so they must stay
  # compiling against the exact package implementations they measure. Test when a tool declares a test
  # target; Backfill remains build-only.
  tools:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        tool:
          - SleepBench
          - SleepPSG
          - Backfill
          - HRVArtifactBench
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build ${{ matrix.tool }}
        run: swift build
        working-directory: Tools/${{ matrix.tool }}

      - name: Test ${{ matrix.tool }}
        run: |
          if grep -q 'testTarget' Package.swift; then
            swift test
          else
            echo "no test target in Tools/${{ matrix.tool }} — build-only"
          fi
        working-directory: Tools/${{ matrix.tool }}
